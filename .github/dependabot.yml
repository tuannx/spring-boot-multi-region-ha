version: 2

updates:
  # Spring Boot applications.
  - package-ecosystem: "gradle"
    directories:
      - "/app"
      - "/cases/cassandra/app"
    schedule:
      interval: "weekly"

  # Base images used by each application Dockerfile.
  - package-ecosystem: "docker"
    directories:
      - "/app"
      - "/cases/cassandra/app"
    schedule:
      interval: "weekly"

  # Service images used by the root and Cassandra Compose stacks.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/cases/cassandra"
    schedule:
      interval: "weekly"
    ignore:
      # These images are built locally by the Compose stacks, not published.
      - dependency-name: "multiregion-*"

  # Floci infrastructure providers.
  - package-ecosystem: "terraform"
    directory: "/infra/floci/terraform"
    schedule:
      interval: "weekly"

  # Actions in .github/workflows are discovered from the repository root.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
