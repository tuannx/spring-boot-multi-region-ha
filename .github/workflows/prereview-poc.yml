name: PreReview JVM POC
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prereview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run PreReview JVM POC
        shell: bash
        run: bash .prereview/prereview.sh prereview.yml
