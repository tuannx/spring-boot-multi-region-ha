name: Application E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: corretto
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.7.1"

      - name: Run unit, integration, and architecture tests
        run: |
          gradle -p app clean test --no-daemon
          gradle -p cases/cassandra/app clean test --no-daemon

      - name: Validate Cassandra case Compose model
        run: docker compose -f cases/cassandra/docker-compose.yml config --quiet

      - name: Run Docker end-to-end acceptance
        run: ./scripts/e2e-acceptance.sh --start --cleanup --verify-failover

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acceptance-evidence
          path: reports/queue-takeover/
          if-no-files-found: ignore

  floci-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Run Floci infrastructure and application acceptance
        run: ./scripts/floci-e2e.sh --cleanup

      - name: Upload Floci acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: floci-acceptance-evidence
          path: |
            reports/floci/
            reports/queue-takeover/
          if-no-files-found: ignore
