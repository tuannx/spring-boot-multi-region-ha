name: Application E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "21"

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "9.7.1"

      - name: Run unit, integration, and architecture tests
        run: |
          gradle -p app clean test --no-daemon
          gradle -p cases/cassandra/app clean test --no-daemon
          gradle -p cases/servicetalk-router/app clean test --no-daemon
          gradle -p cases/elasticache-global/app clean test --no-daemon

      - name: Validate Cassandra case Compose model
        run: docker compose -f cases/cassandra/docker-compose.yml config --quiet

      - name: Validate ServiceTalk router case Compose model
        run: docker compose -f cases/servicetalk-router/docker-compose.yml config --quiet

      - name: Validate ElastiCache Global (Valkey) case Compose model
        run: docker compose -f cases/elasticache-global/docker-compose.yml config --quiet

      - name: Upload application test and QuickPerf measurements
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: application-test-reports
          path: |
            app/build/test-results/test/
            app/build/reports/tests/test/
            cases/servicetalk-router/app/build/test-results/test/
            cases/servicetalk-router/app/build/reports/tests/test/
            cases/elasticache-global/app/build/test-results/test/
            cases/elasticache-global/app/build/reports/tests/test/
          if-no-files-found: ignore

      - name: Run Docker end-to-end acceptance
        run: ./scripts/e2e-acceptance.sh --start --cleanup --verify-failover

      - name: Run ElastiCache Global (Valkey) case Docker acceptance
        run: ./scripts/elasticache-global-e2e.sh --start --cleanup

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acceptance-evidence
          path: reports/queue-takeover/
          if-no-files-found: ignore

  floci-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Run Floci infrastructure and application acceptance
        run: ./scripts/floci-e2e.sh --cleanup

      - name: Provision ElastiCache (Valkey) clusters through Floci
        run: |
          docker compose -f docker-compose.floci.yml up -d floci-us floci-eu
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:4566/ && curl -s -o /dev/null http://localhost:4567/; then
              break
            fi
            sleep 2
          done
          terraform -chdir=cases/elasticache-global/terraform init -input=false
          terraform -chdir=cases/elasticache-global/terraform apply -auto-approve -input=false \
            -var="floci_us_endpoint=http://localhost:4566" \
            -var="floci_eu_endpoint=http://localhost:4567"
          terraform -chdir=cases/elasticache-global/terraform output
          terraform -chdir=cases/elasticache-global/terraform destroy -auto-approve -input=false \
            -var="floci_us_endpoint=http://localhost:4566" \
            -var="floci_eu_endpoint=http://localhost:4567"
          docker compose -f docker-compose.floci.yml down --volumes --remove-orphans

      - name: Upload Floci acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: floci-acceptance-evidence
          path: |
            reports/floci/
            reports/queue-takeover/
          if-no-files-found: ignore
