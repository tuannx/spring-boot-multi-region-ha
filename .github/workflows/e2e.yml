name: Application E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Test failover drill calculations
        working-directory: scripts
        run: python3 -m unittest failover_drill.test_metrics failover_drill.test_traces

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: corretto
          java-version: "21"

      - name: Set up Java 26
        uses: actions/setup-java@v6.0.1
        with:
          distribution: corretto
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "9.7.1"

      - name: Run unit, integration, and architecture tests
        run: |
          gradle -p app clean test --no-daemon
          gradle -p cases/cassandra/app clean test --no-daemon
          gradle -p cases/servicetalk-router/app clean test --no-daemon
          gradle -p cases/elasticache-global/app clean test --no-daemon

      - name: Validate Cassandra case Compose model
        run: docker compose -f cases/cassandra/docker-compose.yml config --quiet

      - name: Validate ServiceTalk router case Compose model
        run: docker compose -f cases/servicetalk-router/docker-compose.yml config --quiet

      - name: Validate ElastiCache Global (Valkey) case Compose model
        run: docker compose -f cases/elasticache-global/docker-compose.yml config --quiet

      - name: Upload application test and QuickPerf measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: application-test-reports
          path: |
            app/build/test-results/test/
            app/build/reports/tests/test/
            cases/servicetalk-router/app/build/test-results/test/
            cases/servicetalk-router/app/build/reports/tests/test/
            cases/elasticache-global/app/build/test-results/test/
            cases/elasticache-global/app/build/reports/tests/test/
          if-no-files-found: ignore

      - name: Run Docker end-to-end acceptance
        run: ./scripts/e2e-acceptance.sh --start --cleanup --verify-failover

      - name: Run ElastiCache Global (Valkey) case Docker acceptance
        run: ./scripts/elasticache-global-e2e.sh --start --cleanup

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence
          path: reports/queue-takeover/
          if-no-files-found: ignore

      - name: Export application images for the failover drill
        if: success()
        run: |
          mkdir -p reports/stack-images
          docker save multiregion-app-us:latest multiregion-app-eu:latest \
            | gzip -1 > reports/stack-images/images.tar.gz
          ls -lh reports/stack-images/images.tar.gz

      - name: Upload application images
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: stack-images
          path: reports/stack-images/images.tar.gz
          retention-days: 1
          if-no-files-found: error

  failover-drill:
    needs: test-and-acceptance
    if: needs.test-and-acceptance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Test failover drill calculations
        working-directory: scripts
        run: python3 -m unittest failover_drill.test_metrics failover_drill.test_traces

      - name: Download application images
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          name: stack-images
          path: reports/stack-images

      - name: Fetch the main baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FAILOVER_DRILL_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: ./scripts/failover-drill-fetch-baseline.sh

      - name: Run the failover drill
        id: drill
        continue-on-error: true
        env:
          FAILOVER_DRILL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILOVER_DRILL_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/failover-drill.sh

      - name: Upload the drill report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failover-drill-report
          path: reports/failover-drill/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload OTLP traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: otlp-trace.json
          path: reports/failover-drill/otlp-trace.json
          retention-days: 30
          if-no-files-found: error

      - name: Stage the main baseline
        if: >-
          always() &&
          steps.drill.outcome == 'success' &&
          (
            github.event_name == 'schedule' ||
            (
              github.ref == 'refs/heads/main' &&
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
            )
          )
        run: |
          mkdir -p reports/failover-drill-baseline
          cp reports/failover-drill/drill-report.json reports/failover-drill-baseline/drill-report.json

      - name: Upload the main baseline
        if: >-
          always() &&
          steps.drill.outcome == 'success' &&
          (
            github.event_name == 'schedule' ||
            (
              github.ref == 'refs/heads/main' &&
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
            )
          )
        uses: actions/upload-artifact@v7
        with:
          name: failover-drill-baseline
          path: reports/failover-drill-baseline/drill-report.json
          retention-days: 90
          if-no-files-found: error

      - name: Post the sticky drill comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILOVER_DRILL_PR_NUMBER: ${{ github.event.pull_request.number }}
          FAILOVER_DRILL_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: ./scripts/failover-drill-comment.sh

      - name: Publish the drill summary
        if: always()
        run: |
          if [ -f reports/failover-drill/comment.md ]; then
            cat reports/failover-drill/comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce the failover drill gate
        if: always()
        run: test "${{ steps.drill.outcome }}" = "success"

  floci-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Run Floci infrastructure and application acceptance
        run: ./scripts/floci-e2e.sh --cleanup

      - name: Provision ElastiCache (Valkey) clusters through Floci
        run: |
          docker compose -f docker-compose.floci.yml up -d floci-us floci-eu
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:4566/ && curl -s -o /dev/null http://localhost:4567/; then
              break
            fi
            sleep 2
          done
          terraform -chdir=cases/elasticache-global/terraform init -input=false
          terraform -chdir=cases/elasticache-global/terraform apply -auto-approve -input=false \
            -var="floci_us_endpoint=http://localhost:4566" \
            -var="floci_eu_endpoint=http://localhost:4567"
          terraform -chdir=cases/elasticache-global/terraform output
          terraform -chdir=cases/elasticache-global/terraform destroy -auto-approve -input=false \
            -var="floci_us_endpoint=http://localhost:4566" \
            -var="floci_eu_endpoint=http://localhost:4567"
          docker compose -f docker-compose.floci.yml down --volumes --remove-orphans

      - name: Upload Floci acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: floci-acceptance-evidence
          path: |
            reports/floci/
            reports/queue-takeover/
          if-no-files-found: ignore
