x-cassandra-environment: &cassandra-environment
  CASSANDRA_CLUSTER_NAME: multiregion-catalog
  CASSANDRA_SEEDS: cassandra-us-1
  CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
  CASSANDRA_NUM_TOKENS: 16
  MAX_HEAP_SIZE: 512M
  HEAP_NEWSIZE: 128M

x-cassandra-service: &cassandra-service
  image: cassandra:5.0.8
  restart: unless-stopped
  healthcheck:
    test:
      - CMD-SHELL
      - cqlsh 127.0.0.1 9042 -e "SELECT release_version FROM system.local" >/dev/null 2>&1
    interval: 10s
    timeout: 8s
    retries: 30
    start_period: 45s
  networks:
    - cassandra-multiregion

services:
  cassandra-us-1:
    <<: *cassandra-service
    container_name: multiregion-cassandra-us-1
    hostname: cassandra-us-1
    environment:
      <<: *cassandra-environment
      CASSANDRA_DC: us-east-1
      CASSANDRA_RACK: us-east-1a
    ports:
      - "9042:9042"
    volumes:
      - cassandra-us-1-data:/var/lib/cassandra

  cassandra-us-2:
    <<: *cassandra-service
    container_name: multiregion-cassandra-us-2
    hostname: cassandra-us-2
    environment:
      <<: *cassandra-environment
      CASSANDRA_DC: us-east-1
      CASSANDRA_RACK: us-east-1b
    depends_on:
      cassandra-us-1:
        condition: service_healthy
    volumes:
      - cassandra-us-2-data:/var/lib/cassandra

  cassandra-us-3:
    <<: *cassandra-service
    container_name: multiregion-cassandra-us-3
    hostname: cassandra-us-3
    environment:
      <<: *cassandra-environment
      CASSANDRA_DC: us-east-1
      CASSANDRA_RACK: us-east-1c
    depends_on:
      cassandra-us-2:
        condition: service_healthy
    volumes:
      - cassandra-us-3-data:/var/lib/cassandra

  cassandra-eu-1:
    <<: *cassandra-service
    container_name: multiregion-cassandra-eu-1
    hostname: cassandra-eu-1
    environment:
      <<: *cassandra-environment
      CASSANDRA_DC: eu-west-1
      CASSANDRA_RACK: eu-west-1a
    depends_on:
      cassandra-us-1:
        condition: service_healthy
    ports:
      - "9142:9042"
    volumes:
      - cassandra-eu-1-data:/var/lib/cassandra

  cassandra-eu-2:
    <<: *cassandra-service
    container_name: multiregion-cassandra-eu-2
    hostname: cassandra-eu-2
    environment:
      <<: *cassandra-environment
      CASSANDRA_DC: eu-west-1
      CASSANDRA_RACK: eu-west-1b
    depends_on:
      cassandra-eu-1:
        condition: service_healthy
    volumes:
      - cassandra-eu-2-data:/var/lib/cassandra

  cassandra-eu-3:
    <<: *cassandra-service
    container_name: multiregion-cassandra-eu-3
    hostname: cassandra-eu-3
    environment:
      <<: *cassandra-environment
      CASSANDRA_DC: eu-west-1
      CASSANDRA_RACK: eu-west-1c
    depends_on:
      cassandra-eu-2:
        condition: service_healthy
    volumes:
      - cassandra-eu-3-data:/var/lib/cassandra

  schema-init:
    image: cassandra:5.0.8
    container_name: multiregion-cassandra-schema-init
    restart: "no"
    depends_on:
      cassandra-us-1:
        condition: service_healthy
      cassandra-us-2:
        condition: service_healthy
      cassandra-us-3:
        condition: service_healthy
      cassandra-eu-1:
        condition: service_healthy
      cassandra-eu-2:
        condition: service_healthy
      cassandra-eu-3:
        condition: service_healthy
    volumes:
      - ./docker/schema.cql:/schema.cql:ro
    command:
      - /bin/bash
      - -euc
      - |
        for attempt in $$(seq 1 60); do
          peer_nodes="$$(cqlsh cassandra-us-1 9042 -e 'SELECT peer FROM system.peers_v2;' 2>/dev/null \
            | awk '/^[[:space:]]*[0-9]+\./ { count++ } END { print count+0 }')"
          if [ "$${peer_nodes}" -eq 5 ]; then
            cqlsh cassandra-us-1 9042 -f /schema.cql
            exit 0
          fi
          sleep 5
        done
        echo "Timed out waiting for six Cassandra nodes" >&2
        exit 1
    networks:
      - cassandra-multiregion

  app-us:
    build:
      context: ./app
    image: multiregion-cassandra-app:latest
    container_name: multiregion-cassandra-app-us
    environment:
      SERVER_PORT: 8080
      APP_REGION: us-east-1
      CASSANDRA_LOCAL_DATACENTER: us-east-1
      CASSANDRA_CONTACT_POINTS: cassandra-us-1:9042,cassandra-us-2:9042,cassandra-us-3:9042
    ports:
      - "8180:8080"
    depends_on:
      schema-init:
        condition: service_completed_successfully
    networks:
      - cassandra-multiregion

  app-eu:
    build:
      context: ./app
    image: multiregion-cassandra-app:latest
    container_name: multiregion-cassandra-app-eu
    environment:
      SERVER_PORT: 8080
      APP_REGION: eu-west-1
      CASSANDRA_LOCAL_DATACENTER: eu-west-1
      CASSANDRA_CONTACT_POINTS: cassandra-eu-1:9042,cassandra-eu-2:9042,cassandra-eu-3:9042
    ports:
      - "8181:8080"
    depends_on:
      schema-init:
        condition: service_completed_successfully
    networks:
      - cassandra-multiregion

  nginx-router:
    image: nginx:1.27-alpine
    container_name: multiregion-cassandra-router
    ports:
      - "8100:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-us:
        condition: service_healthy
      app-eu:
        condition: service_healthy
    networks:
      - cassandra-multiregion

volumes:
  cassandra-us-1-data:
  cassandra-us-2-data:
  cassandra-us-3-data:
  cassandra-eu-1-data:
  cassandra-eu-2-data:
  cassandra-eu-3-data:

networks:
  cassandra-multiregion:
    driver: bridge
