upstream cassandra_us_route {
    server app-us:8080 max_fails=1 fail_timeout=5s;
    server app-eu:8080 backup;
    keepalive 16;
}

upstream cassandra_eu_route {
    server app-eu:8080 max_fails=1 fail_timeout=5s;
    server app-us:8080 backup;
    keepalive 16;
}

map $http_x_source_region $route_to_eu {
    default 0;
    eu-west-1 1;
}

server {
    listen 80;
    server_name localhost;

    location / {
        error_page 418 = @eu_region;
        recursive_error_pages on;

        if ($route_to_eu) {
            return 418;
        }

        proxy_pass http://cassandra_us_route;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Source-Region $http_x_source_region;
        add_header X-Preferred-Region us-east-1 always;
    }

    location @eu_region {
        proxy_pass http://cassandra_eu_route;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Source-Region $http_x_source_region;
        add_header X-Preferred-Region eu-west-1 always;
    }
}
