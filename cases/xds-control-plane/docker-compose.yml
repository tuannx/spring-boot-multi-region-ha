# Envoy edge driven by the in-repo xDS control plane, in front of the main stack's app-us and app-eu.
# Start the main stack first (docker compose up -d at the repo root), then:
#   docker compose -f cases/xds-control-plane/docker-compose.yml up -d --build
services:
  xds-control-plane:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: multiregion-xds-control-plane:latest
    container_name: multiregion-xds-control-plane
    restart: unless-stopped
    environment:
      XDS_PORT: 18000
      ADMIN_PORT: 18001
      US_ENDPOINT_HOST: app-us
      US_ENDPOINT_PORT: 8080
      EU_ENDPOINT_HOST: app-eu
      EU_ENDPOINT_PORT: 8081
    ports:
      - "${XDS_ADMIN_PORT:-18001}:18001"
    networks:
      - multiregion-net

  envoy:
    image: envoyproxy/envoy:v1.39.1
    container_name: multiregion-envoy-edge
    restart: unless-stopped
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "${ENVOY_EDGE_PORT:-8010}:10000"
      - "${ENVOY_ADMIN_PORT:-9901}:9901"
    depends_on:
      - xds-control-plane
    networks:
      - multiregion-net

networks:
  multiregion-net:
    name: spring-boot-multi-region-ha_multiregion-net
    external: true
