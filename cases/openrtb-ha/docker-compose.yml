# Local HA simulation: one PostgreSQL (stand-in for Aurora), two bidders, one HAProxy (stand-in for
# the ALB). Gradle builds the bidder image inside Docker, so no host JDK is needed.
name: openrtb-ha

x-bidder: &bidder
  build:
    context: .
    dockerfile: bidder/Dockerfile
  image: openrtb-bidder:poc
  depends_on:
    postgres:
      condition: service_healthy
  environment: &bidder-env
    DB_URL: jdbc:postgresql://postgres:5432/openrtb
    DB_USER: openrtb
    DB_PASSWORD: openrtb
    DB_POOL_SIZE: "10"
    # Burl and nurl URLs go through the load balancer, as they would in production.
    PUBLIC_BASE_URL: http://localhost:8088
  # No container healthcheck: HAProxy runs the readiness check from outside the container.
  restart: "no"

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: openrtb
      POSTGRES_PASSWORD: openrtb
      POSTGRES_DB: openrtb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrtb -d openrtb"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Host ports are published so the benchmarks can read each bidder's own CPU and request
  # counters from /actuator/prometheus, without the load generator's CPU in the numbers.
  bidder-a:
    <<: *bidder
    environment:
      <<: *bidder-env
      INSTANCE_ID: bidder-a
    ports:
      - "8081:8080"

  bidder-b:
    <<: *bidder
    environment:
      <<: *bidder-env
      INSTANCE_ID: bidder-b
    ports:
      - "8082:8080"

  haproxy:
    image: haproxy:2.8-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8088:8080"
      - "8404:8404"
    depends_on:
      - bidder-a
      - bidder-b
