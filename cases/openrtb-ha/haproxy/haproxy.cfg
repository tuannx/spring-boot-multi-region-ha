# HAProxy stands in for the AWS Application Load Balancer in this local simulation.
# Two things give the fast failover:
#   1. "retry-on conn-failure" re-sends a request to the other bidder as soon as a connect fails.
#      This covers the window before health checks have noticed the dead instance.
#   2. Active HTTP health checks on /actuator/health/readiness remove the instance from rotation
#      within fall x inter (2 x 500 ms) and return it after rise x inter.
# Retrying POST /bid is safe because bidding has no side effects. Retrying GET /burl is safe
# because billing is idempotent on the bid id (see ledger/BillingLedger.java).

global
  log stdout format raw local0
  # HAProxy reserves about 2 x maxconn file descriptors. The container allows 20000, so 20000
  # here made HAProxy exit at startup. 4000 is well above what the benchmarks need.
  maxconn 4000

defaults
  mode http
  log global
  option httplog
  option dontlognull
  option redispatch
  retries 2
  retry-on conn-failure empty-response response-timeout 503
  timeout connect 300ms
  timeout client 2s
  timeout server 1s
  timeout http-request 1s
  timeout http-keep-alive 10s
  default-server inter 500ms fastinter 250ms downinter 500ms fall 2 rise 2

frontend bid_in
  bind *:8080
  default_backend bidders

backend bidders
  balance roundrobin
  option httpchk GET /actuator/health/readiness
  http-check expect status 200
  # slowstart: a server that comes back up gets its weight back over 30 s instead of at once.
  # A restarted JVM is still JIT-compiling, and full traffic at once is what made it late.
  server bidder-a bidder-a:8080 check slowstart 30s
  server bidder-b bidder-b:8080 check slowstart 30s

frontend stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 2s
