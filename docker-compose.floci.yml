services:
  floci-us:
    image: floci/floci:1.5.34
    container_name: spring-ha-floci-us
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_HOSTNAME: floci-us
      FLOCI_SERVICES_DOCKER_NETWORK: spring-ha-floci
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "7010"
      FLOCI_STORAGE_MODE: memory
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - floci-net

  floci-eu:
    image: floci/floci:1.5.34
    container_name: spring-ha-floci-eu
    environment:
      FLOCI_DEFAULT_REGION: eu-west-1
      FLOCI_HOSTNAME: floci-eu
      FLOCI_SERVICES_DOCKER_NETWORK: spring-ha-floci
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "7010"
      FLOCI_STORAGE_MODE: memory
    ports:
      - "4567:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - floci-net

  postgres-us:
    image: alpine/socat:1.8.0.3
    container_name: spring-ha-floci-postgres-us
    command:
      - -d
      - -d
      - TCP-LISTEN:5432,fork,reuseaddr
      - TCP:floci-us:${FLOCI_DATABASE_US_PORT:-7001}
    depends_on:
      - floci-us
    networks:
      - floci-net

  postgres-eu:
    image: alpine/socat:1.8.0.3
    container_name: spring-ha-floci-postgres-eu
    command:
      - -d
      - -d
      - TCP-LISTEN:5432,fork,reuseaddr
      - TCP:floci-eu:${FLOCI_DATABASE_EU_PORT:-7001}
    depends_on:
      - floci-eu
    networks:
      - floci-net

  rabbitmq-us:
    image: alpine/socat:1.8.0.3
    container_name: spring-ha-floci-rabbitmq-us
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        socat TCP-LISTEN:5672,fork,reuseaddr
        TCP:${FLOCI_RABBITMQ_US_HOST:-127.0.0.1}:${FLOCI_RABBITMQ_US_PORT:-5672} &
        exec socat TCP-LISTEN:15672,fork,reuseaddr
        TCP:${FLOCI_RABBITMQ_US_HOST:-127.0.0.1}:15672
    ports:
      - "5672:5672"
      - "15672:15672"
    depends_on:
      - floci-us
    networks:
      - floci-net

  rabbitmq-eu:
    image: alpine/socat:1.8.0.3
    container_name: spring-ha-floci-rabbitmq-eu
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        socat TCP-LISTEN:5672,fork,reuseaddr
        TCP:${FLOCI_RABBITMQ_EU_HOST:-127.0.0.1}:${FLOCI_RABBITMQ_EU_PORT:-5672} &
        exec socat TCP-LISTEN:15672,fork,reuseaddr
        TCP:${FLOCI_RABBITMQ_EU_HOST:-127.0.0.1}:15672
    ports:
      - "5673:5672"
      - "15673:15672"
    depends_on:
      - floci-eu
    networks:
      - floci-net

  db-tools:
    image: postgres:18-alpine
    container_name: spring-ha-floci-db-tools
    entrypoint:
      - /bin/sh
      - -c
      - trap 'exit 0' TERM INT; while :; do sleep 3600; done
    networks:
      - floci-net

  app-us:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        SPRING_PROFILES_ACTIVE: region-us
    image: multiregion-app-floci-us:latest
    container_name: multiregion-floci-app-us
    environment:
      SPRING_PROFILES_ACTIVE: region-us
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASS: ${FLOCI_DATABASE_PASSWORD:-AppPass123!}
      AWS_REGION: us-east-1
      REGION_ROLE: primary
      ACTIVE_WRITER_DB_HOST: postgres-us
      ACTIVE_WRITER_DB_PORT: 5432
      LOCAL_DB_HOST: postgres-us
      LOCAL_DB_PORT: 5432
      FAILOVER_WRITER_DB_HOST: postgres-eu
      FAILOVER_WRITER_DB_PORT: 5432
      FAILOVER_FAILURE_THRESHOLD: 3
      FAILOVER_ALLOW_UNFENCED_PROMOTION: "false"
      APP_PORT: 8080
      QUEUE_LISTENER_TYPE: rabbit
      RABBITMQ_US_HOST: rabbitmq-us
      RABBITMQ_US_PORT: 5672
      RABBITMQ_EU_HOST: rabbitmq-eu
      RABBITMQ_EU_PORT: 5672
      RABBITMQ_USER: appuser
      RABBITMQ_PASS: ${FLOCI_RABBITMQ_PASSWORD:-AppPass123456!}
    ports:
      - "8080:8080"
    depends_on:
      - postgres-us
      - postgres-eu
      - rabbitmq-us
      - rabbitmq-eu
    networks:
      - floci-net

  app-eu:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        SPRING_PROFILES_ACTIVE: region-eu
    image: multiregion-app-floci-eu:latest
    container_name: multiregion-floci-app-eu
    environment:
      SPRING_PROFILES_ACTIVE: region-eu
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASS: ${FLOCI_DATABASE_PASSWORD:-AppPass123!}
      AWS_REGION: eu-west-1
      REGION_ROLE: secondary
      ACTIVE_WRITER_DB_HOST: postgres-us
      ACTIVE_WRITER_DB_PORT: 5432
      LOCAL_DB_HOST: postgres-eu
      LOCAL_DB_PORT: 5432
      FAILOVER_WRITER_DB_HOST: postgres-eu
      FAILOVER_WRITER_DB_PORT: 5432
      FAILOVER_FAILURE_THRESHOLD: 3
      FAILOVER_ALLOW_UNFENCED_PROMOTION: "false"
      APP_PORT: 8081
      QUEUE_LISTENER_TYPE: rabbit
      RABBITMQ_US_HOST: rabbitmq-us
      RABBITMQ_US_PORT: 5672
      RABBITMQ_EU_HOST: rabbitmq-eu
      RABBITMQ_EU_PORT: 5672
      RABBITMQ_USER: appuser
      RABBITMQ_PASS: ${FLOCI_RABBITMQ_PASSWORD:-AppPass123456!}
    ports:
      - "8081:8081"
    depends_on:
      - postgres-us
      - postgres-eu
      - rabbitmq-us
      - rabbitmq-eu
    networks:
      - floci-net

  nginx-router:
    image: nginx:alpine
    container_name: multiregion-floci-router
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-us
      - app-eu
    networks:
      - floci-net

networks:
  floci-net:
    name: spring-ha-floci
