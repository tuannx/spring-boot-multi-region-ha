services:
  # ============================================
  # REGION 1: us-east-1 (Primary Writer)
  # ============================================
  postgres-us:
    image: postgres:18.6
    container_name: multiregion-us
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      TZ: UTC
    ports:
      - "5442:5432"
    volumes:
      # Schema is Flyway-managed by each app against its home database.
      # PostgreSQL 18 stores cluster data below a major-version directory.
      # Mount the parent directory so pg_upgrade can work across major versions.
      - pg-us-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      multiregion-net:
        aliases:
          - postgres-us.local

  app-us:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        SPRING_PROFILES_ACTIVE: region-us
    image: multiregion-app-us:latest
    container_name: multiregion-app-us
    environment:
      SPRING_PROFILES_ACTIVE: region-us
      DB_HOST: postgres-us
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASS: apppass
      AWS_REGION: us-east-1
      REGION_ROLE: primary
      ACTIVE_WRITER_DB_HOST: postgres-us
      ACTIVE_WRITER_DB_PORT: 5432
      LOCAL_DB_HOST: postgres-us
      LOCAL_DB_PORT: 5432
      FAILOVER_WRITER_DB_HOST: postgres-eu
      FAILOVER_WRITER_DB_PORT: 5432
      FAILOVER_FAILURE_THRESHOLD: 3
      FAILOVER_ALLOW_UNFENCED_PROMOTION: "false"
      SERVER_PORT: 8080
      QUEUES_LISTENERTYPE: rabbit
      QUEUES_RABBITMQ_BROKERS_US_EAST_1_HOST: rabbitmq-us
      QUEUES_RABBITMQ_BROKERS_US_EAST_1_PORT: 5672
      QUEUES_RABBITMQ_BROKERS_EU_WEST_1_HOST: rabbitmq-eu
      QUEUES_RABBITMQ_BROKERS_EU_WEST_1_PORT: 5672
      QUEUES_RABBITMQ_USERNAME: appuser
      QUEUES_RABBITMQ_PASSWORD: apppass
    ports:
      - "${APP_US_HOST_PORT:-8080}:8080"
    depends_on:
      postgres-us:
        condition: service_healthy
      rabbitmq-us:
        condition: service_healthy
      rabbitmq-eu:
        condition: service_healthy
    networks:
      - multiregion-net

  # ============================================
  # REGION 2: eu-west-1 (Secondary / DR)
  # ============================================
  postgres-eu:
    image: postgres:18.6
    container_name: multiregion-eu
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      # Schema is Flyway-managed by each app against its home database.
      # PostgreSQL 18 stores cluster data below a major-version directory.
      # Mount the parent directory so pg_upgrade can work across major versions.
      - pg-eu-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      multiregion-net:
        aliases:
          - postgres-eu.local

  app-eu:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        SPRING_PROFILES_ACTIVE: region-eu
    image: multiregion-app-eu:latest
    container_name: multiregion-app-eu
    environment:
      SPRING_PROFILES_ACTIVE: region-eu
      DB_HOST: postgres-eu
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASS: apppass
      AWS_REGION: eu-west-1
      REGION_ROLE: secondary
      ACTIVE_WRITER_DB_HOST: postgres-us
      ACTIVE_WRITER_DB_PORT: 5432
      LOCAL_DB_HOST: postgres-eu
      LOCAL_DB_PORT: 5432
      FAILOVER_WRITER_DB_HOST: postgres-eu
      FAILOVER_WRITER_DB_PORT: 5432
      FAILOVER_FAILURE_THRESHOLD: 3
      FAILOVER_ALLOW_UNFENCED_PROMOTION: "false"
      SERVER_PORT: 8081
      QUEUES_LISTENERTYPE: rabbit
      QUEUES_RABBITMQ_BROKERS_US_EAST_1_HOST: rabbitmq-us
      QUEUES_RABBITMQ_BROKERS_US_EAST_1_PORT: 5672
      QUEUES_RABBITMQ_BROKERS_EU_WEST_1_HOST: rabbitmq-eu
      QUEUES_RABBITMQ_BROKERS_EU_WEST_1_PORT: 5672
      QUEUES_RABBITMQ_USERNAME: appuser
      QUEUES_RABBITMQ_PASSWORD: apppass
    ports:
      - "${APP_EU_HOST_PORT:-8081}:8081"
    depends_on:
      postgres-eu:
        condition: service_healthy
      rabbitmq-us:
        condition: service_healthy
      rabbitmq-eu:
        condition: service_healthy
      # EU validates JPA against the US writer pool, so it must boot after
      # app-us has migrated postgres-us. app-us health implies migration done
      # because Flyway runs before the context reports UP.
      app-us:
        condition: service_healthy
    networks:
      - multiregion-net

  # ============================================
  # REGION 1 QUEUE: RabbitMQ for us-east-1
  # ============================================
  rabbitmq-us:
    image: rabbitmq:4.3.5-management
    container_name: multiregion-rabbitmq-us
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        printf '%s' "$${RABBITMQ_ERLANG_COOKIE}" > /var/lib/rabbitmq/.erlang.cookie;
        chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie;
        chmod 0400 /var/lib/rabbitmq/.erlang.cookie;
        exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: appuser
      RABBITMQ_DEFAULT_PASS: apppass
      RABBITMQ_ERLANG_COOKIE: spring-ha-local-cookie
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-us-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - multiregion-net

  # ============================================
  # REGION 2 QUEUE: RabbitMQ for eu-west-1
  # ============================================
  rabbitmq-eu:
    image: rabbitmq:4.3.5-management
    container_name: multiregion-rabbitmq-eu
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        printf '%s' "$${RABBITMQ_ERLANG_COOKIE}" > /var/lib/rabbitmq/.erlang.cookie;
        chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie;
        chmod 0400 /var/lib/rabbitmq/.erlang.cookie;
        exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: appuser
      RABBITMQ_DEFAULT_PASS: apppass
      RABBITMQ_ERLANG_COOKIE: spring-ha-local-cookie
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-eu-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - multiregion-net

  # ============================================
  # ServiceTalk Locality Router (Default Ingress)
  # ============================================
  servicetalk-router:
    build:
      context: ./cases/servicetalk-router/app
      dockerfile: Dockerfile
    image: multiregion-servicetalk-router:latest
    container_name: multiregion-router
    restart: unless-stopped
    environment:
      ROUTER_PORT: 8085
      US_ENDPOINT_HOST: app-us
      US_ENDPOINT_PORT: 8080
      EU_ENDPOINT_HOST: app-eu
      EU_ENDPOINT_PORT: 8081
      FAILURE_THRESHOLD: 3
      COOLDOWN_MS: 5000
      CONNECT_TIMEOUT_MS: 500
      REQUEST_TIMEOUT_MS: 800
    ports:
      - "${ROUTER_HOST_PORT:-8000}:8085"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      - app-us
      - app-eu
    networks:
      multiregion-net:
        aliases:
          - router.local
          - servicetalk-router.local

  # ============================================
  # Legacy Nginx Router (Optional Comparison)
  # ============================================
  nginx-router:
    profiles:
      - legacy-nginx
      - comparison
    image: nginx:1.31.5-alpine
    container_name: multiregion-nginx-router
    ports:
      - "${NGINX_ROUTER_HOST_PORT:-8001}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-us
      - app-eu
    networks:
      - multiregion-net

volumes:
  pg-us-data:
  pg-eu-data:
  rabbitmq-us-data:
  rabbitmq-eu-data:

networks:
  multiregion-net:
    driver: bridge
